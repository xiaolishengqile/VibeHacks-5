<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>启动日轻面板</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body class="mini-body">
		<main id="mini-shell" class="shell shell--mini">
			<header class="mini-header drag-region">
				<div>
					<p class="eyebrow">启动日日历</p>
					<p id="mini-calendar-range" class="mini-kicker">本周</p>
				</div>
				<div class="window-actions" aria-label="窗口操作">
					<details class="mini-menu">
						<summary id="mini-more" aria-label="更多操作" title="更多操作">…</summary>
						<div class="mini-menu-list">
							<button id="change-owner" type="button">更换协作方</button>
							<button id="change-deadline" type="button">调整截止时间</button>
							<button id="stop-work" type="button">停止节点</button>
							<button id="reset-application-data" class="danger-text-button" type="button">清理数据</button>
						</div>
					</details>
					<button id="close-mini-panel" class="window-close" type="button" aria-label="关闭轻面板" title="关闭轻面板（桌宠继续运行）">×</button>
				</div>
			</header>

			<section class="mini-calendar" aria-label="当日日程" aria-live="polite">
				<div class="mini-day-heading">
					<div><strong id="mini-focus-weekday">今天</strong><span id="mini-focus-date">当前日期</span></div>
					<span id="action-risk" class="pill">暂无计划</span>
				</div>
				<div class="mini-agenda-row">
					<time id="action-time">现在</time>
					<div class="mini-event-card">
						<h1 id="action-title">告诉我你想完成什么</h1>
						<p id="action-reason">我会整理目标、依赖、等待时间和最晚开始时间。</p>
					</div>
				</div>
			</section>

			<section class="input-card">
				<label for="work-input">添加日程</label>
				<textarea id="work-input" rows="3" placeholder="例如：下周五前完成季度复盘，需要等同事一天的数据"></textarea>
				<div class="input-actions">
					<button id="submit-work" class="primary-button" type="button" disabled>整理计划</button>
				</div>
				<p id="submit-message" class="form-message" aria-live="polite"></p>
			</section>

			<section class="compact-card">
				<div class="card-heading"><h2>计划与权限</h2></div>
				<p id="plan-summary">暂无计划。执行前会展示范围并请求确认。</p>
				<p id="profile-summary" class="muted">提交首个真实工作案例后建立个人工作习惯。</p>
				<button id="confirm-profile" class="text-button" type="button" hidden>确认工作习惯</button>
				<p id="approval-summary" class="muted">当前没有待确认操作</p>
			</section>

			<section class="compact-card">
				<div class="card-heading"><h2>执行进度</h2><span id="codex-status" class="pill">正在检查代理</span></div>
				<p id="progress-summary">当前没有执行任务</p>
				<a id="result-link" class="result-link" href="#" aria-disabled="true">暂无可验收成果</a>
				<div class="button-row execution-controls">
					<button id="execution-primary" class="primary-button" type="button" disabled>生成执行计划</button>
					<button id="execution-secondary" class="danger-button" type="button" hidden>拒绝</button>
					<button id="codex-login" class="text-button" type="button" hidden>登录执行代理</button>
				</div>
			</section>

			<button id="open-workbench" class="secondary-button" type="button">打开完整工作台</button>
		</main>
		<script type="module" src="mini-panel.js"></script>
	</body>
</html>
