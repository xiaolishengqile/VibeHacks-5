<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>启动日工作台</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<main class="shell shell--workbench">
			<header class="workbench-header">
				<div>
					<p class="eyebrow">启动日工作台</p>
					<h1 id="goal-title">把想法变成今天能推进的工作</h1>
					<p id="goal-deadline">输入工作想法后，这里会展示完整计划。</p>
				</div>
				<button id="workbench-directory" class="secondary-button compact-button" type="button">选择工作目录</button>
			</header>

			<div class="dashboard-grid">
				<section class="panel panel--today">
					<p class="section-label">今天</p>
					<h2 id="today-title">暂无当前行动</h2>
					<div class="meta-row"><span id="today-risk" class="pill">等待输入</span><span id="today-time" class="muted"></span></div>
					<p id="today-reason">从桌宠打开轻面板，输入你想完成的工作。</p>
				</section>

				<section class="panel panel--graph">
					<div class="section-heading"><div><p class="section-label">工作图</p><h2>节点与依赖</h2></div><span id="graph-count" class="muted">0 个节点</span></div>
					<div id="graph-list" class="stack-list empty-state">正在加载工作计划</div>
				</section>

				<section class="panel">
					<p class="section-label">协作</p><h2>等待中的协作者</h2>
					<div id="waiting-list" class="stack-list empty-state">暂无等待事项</div>
				</section>

				<section class="panel">
					<p class="section-label">决策解释</p><h2>为什么现在做</h2>
					<p id="decision-explanation">暂无可解释的排期决策</p>
				</section>

				<section class="panel">
					<p class="section-label">执行</p><h2>执行任务</h2>
					<div id="execution-list" class="stack-list empty-state">当前没有执行任务</div>
				</section>

				<section class="panel">
					<p class="section-label">权限</p><h2>等待确认</h2>
					<div id="approval-list" class="stack-list empty-state">当前没有待确认操作</div>
				</section>

				<section class="panel">
					<p class="section-label">成果</p><h2>可验收成果</h2>
					<div id="artifact-list" class="stack-list empty-state">当前没有可验收成果</div>
				</section>

				<section class="panel">
					<p class="section-label">记录</p><h2>决策与执行历史</h2>
					<div id="history-list" class="stack-list empty-state">当前没有历史记录</div>
				</section>
			</div>
		</main>
		<script type="module" src="workbench.js"></script>
	</body>
</html>
