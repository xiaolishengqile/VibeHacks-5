<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>启动日工作台</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body class="workbench-body">
		<main class="shell shell--workbench">
			<header class="workbench-header">
				<div>
					<p class="eyebrow">启动日</p>
					<h1 id="goal-title">把想法变成今天能推进的工作</h1>
					<p id="goal-deadline">输入工作想法后，这里会展示完整计划。</p>
				</div>
			</header>

			<section class="calendar-panel" aria-label="周日历">
				<div class="calendar-toolbar">
					<div>
						<p class="section-label">工作日历</p>
						<h2 id="calendar-range">本周</h2>
						<p id="calendar-outside" class="calendar-outside" hidden></p>
					</div>
					<div class="calendar-actions" aria-label="切换周">
						<button id="calendar-prev-week" class="icon-button" type="button" aria-label="上一周" title="上一周">‹</button>
						<button id="calendar-next-week" class="icon-button" type="button" aria-label="下一周" title="下一周">›</button>
					</div>
				</div>
				<div id="week-calendar" class="week-calendar" aria-live="polite"></div>
			</section>

			<div class="dashboard-grid">
				<section class="panel panel--today">
					<p class="section-label">当前</p>
					<h2 id="today-title">暂无当前行动</h2>
					<div class="meta-row"><span id="today-risk" class="pill">等待输入</span><span id="today-time" class="muted"></span></div>
					<p id="today-reason">从桌宠打开轻面板，输入你想完成的工作。</p>
					<label class="permission-toggle" for="allow-web-research">
						<input id="allow-web-research" type="checkbox">
						<span>允许本次计划访问公开网页</span>
					</label>
					<button id="start-today-execution" class="primary-button" type="button" disabled>生成执行计划</button>
				</section>

				<section class="panel panel--graph">
					<div class="section-heading"><div><p class="section-label">计划</p><h2>节点与依赖</h2></div><span id="graph-count" class="muted">0 个节点</span></div>
					<div id="graph-list" class="stack-list empty-state">正在加载工作计划</div>
				</section>

				<details id="execution-panel" class="panel panel--execution">
					<summary class="execution-toggle" role="button" aria-label="执行状态">
						<div><p class="section-label">执行</p><h2>执行状态</h2></div>
						<span id="readiness-summary" class="muted">正在检查执行环境</span>
					</summary>
					<div class="execution-panel-body">
						<div class="button-row">
							<button id="codex-login" class="text-button" type="button" hidden>登录</button>
							<button id="codex-refresh" class="text-button" type="button">刷新状态</button>
						</div>
						<div id="execution-state-list" class="stack-list empty-state">当前没有执行任务或待确认操作</div>
					</div>
				</details>

				<details class="panel panel--history">
					<summary>查看记录</summary>
					<div id="history-list" class="stack-list empty-state">当前没有历史记录</div>
				</details>
			</div>
		</main>
		<script type="module" src="workbench.js"></script>
	</body>
</html>
